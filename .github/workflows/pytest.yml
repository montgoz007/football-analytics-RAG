name: Run Pytest on Merge

on:
  push:
    branches:
      - main  # Change this to the target branch where you want to run tests on merge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"  # Adjust this to match your Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Ensure your dependencies are listed here
          pip install pytest  # Ensure pytest is installed

      - name: Run pytest
        run: pytest
